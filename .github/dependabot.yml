version: 2

# Version-update PRs are intentionally disabled (open-pull-requests-limit: 0).
# Dependabot alerts and security-update PRs, when enabled in GitHub Security settings,
# remain separate from routine scheduled version updates.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
