name: PlatformIO Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Test real DCF77 1 kHz reference fixture
        run: python tools/dcf77_reference_fixture.py
      - name: Test DCF77 and MSF offline identification
        run: python tools/tests/time_signal_scan_test.py
      - name: Test production DCF77 sampler and decoder
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -DESP8266 -Itools/tests -Iinclude tools/tests/decoder_regression.cpp src/dcf77_decoder.cpp src/raw_recording.cpp -o /tmp/dcf77-tests
          /tmp/dcf77-tests
      - name: Build generic DCF77 profile
        run: pio run -e ttgo-t-display
      - name: Build dual 60-77.5 kHz profile
        run: pio run -e ttgo-t-display-dual
      - name: Build HW364A OLED profile
        run: pio run -e hw364a
      - uses: actions/checkout@v4
        with:
          repository: udoklein/dcf77
          ref: 00d2450f47311268ba5de17f35480781928b34dc
          path: .reference-dcf77
      - name: Test exact recording replay with both decoders
        run: python tools/tests/recording_replay_test.py .reference-dcf77
