name: Hardware / DCF77 reception
description: Segnala problemi di ricezione, timing o sincronizzazione
title: "[RX] "
labels: ["hardware"]
body:
  - type: input
    id: receiver
    attributes:
      label: Ricevitore DCF77
      placeholder: marca/modello/link
    validations:
      required: true
  - type: input
    id: supply
    attributes:
      label: Alimentazione
      placeholder: es. 3.3 V
    validations:
      required: true
  - type: dropdown
    id: polarity
    attributes:
      label: Polarità DATA
      options:
        - Active LOW
        - Active HIGH
        - Non determinata
  - type: input
    id: pulse
    attributes:
      label: Impulsi osservati
      placeholder: es. 101 ms / 198 ms
  - type: input
    id: period
    attributes:
      label: Periodo osservato
      placeholder: es. 1000 ms / marker 2000 ms
  - type: input
    id: jitter
    attributes:
      label: Jitter RMS
  - type: input
    id: valid
    attributes:
      label: Percentuale impulsi validi
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostica / screenshot
      description: Incolla dati della console web e allega screenshot.
  - type: textarea
    id: wiring
    attributes:
      label: Cablaggio e ambiente RF
      description: Distanza antenna, alimentatore, orientamento ferrite, sorgenti di disturbo.
