[platformio]
default_envs = hw364a_diag_web

[env:hw364a_diag_web]
platform = espressif8266 @ 4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit SH110X @ ^2.1.12
build_flags =
    -D DCF_DATA_PIN=13
    -D DCF_PON_PIN=5
    -D DCF_PON_ACTIVE_LOW=1
    -D DCF_IDLE_LOW=1
    -D OLED_ENABLED=1
    -D OLED_SDA_PIN=14
    -D OLED_SCL_PIN=12
    -D OLED_I2C_ADDR=0x3C
